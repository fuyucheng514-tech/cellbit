site_name: Microsags
site_description: Reproducible SAG species annotation and species-guided subassembly
site_url: https://fuyucheng514-tech.github.io/cellbit/
repo_url: https://github.com/fuyucheng514-tech/cellbit
repo_name: fuyucheng514-tech/cellbit
edit_uri: edit/main/docs/

theme:
  name: readthedocs
  language: en
  highlightjs: true

nav:
  - Home: index.md
  - Install: install.md
  - Usage examples: usage.md
  - Performance: performance.md
  - Real-data example: pa-hq-tutorial.md
  - Results and output files: outputs.md
  - Adjust Leiden clustering: stage3b.md

exclude_docs: |
  index.html
  styles.css
  app.js
  favicon.svg
  DNA2BIT_PACKED_SEARCH.md
  STAGE3B_STREAMING_OPTIMIZATION_20260904.md
  STAGE3B_FROZEN_SPEC_ZH.md
  PACKAGING_UNDER_1GIB.md
  lake-quarter-tutorial.md
  stage3b_reproduction_v1_termination.json

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true

strict: true
