[workspace]
authors = ["fuyucheng514-tech"]
channels = ["conda-forge", "bioconda"]
name = "microsags"
platforms = ["linux-64"]
version = "0.2.1"

[tasks]
configure = "cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DHTS_ROOT=$CONDA_PREFIX -DCMAKE_INSTALL_PREFIX=$CONDA_PREFIX"
build = { cmd = "cmake --build build --parallel", depends-on = ["configure"] }
test = { cmd = "ctest --test-dir build --output-on-failure", depends-on = ["build"] }
install = { cmd = "cmake --install build", depends-on = ["build"] }
verify = { cmd = "microsags --help", depends-on = ["install"] }
docs = "mkdocs build --strict"

[dependencies]
python = "3.9.*"
cmake = ">=3.20,<5"
ninja = ">=1.11,<2"
cxx-compiler = "*"
pkg-config = "*"
zlib = ">=1.3,<2"
htslib = ">=1.20,<2"
fastp = "0.23.4.*"
spades = "4.2.0.*"
flye = "2.9.6.*"
blast = ">=2.15,<3"
python-igraph = ">=0.11,<1"
leidenalg = ">=0.10,<1"
pyyaml = ">=6,<7"
pigz = ">=2.8,<3"
mkdocs = ">=1.6,<2"
